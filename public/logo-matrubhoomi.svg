<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mbRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="mbLetter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="mbWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <clipPath id="mbCircleClip">
      <circle cx="100" cy="100" r="92"/>
    </clipPath>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#mbRing)"/>
  <circle cx="100" cy="100" r="92" fill="#FBF3E3"/>

  <g clip-path="url(#mbCircleClip)">
    <!-- water band -->
    <path d="M0 150 Q 25 138 50 150 T 100 150 T 150 150 T 200 150 V200 H0 Z" fill="url(#mbWave)"/>
    <path d="M0 162 Q 25 152 50 162 T 100 162 T 150 162 T 200 162 V200 H0 Z" fill="#0e7490" opacity="0.6"/>

    <!-- leaf accent -->
    <path d="M148 40 C 168 44 176 62 168 80 C 150 78 138 60 148 40 Z" fill="#16a34a"/>
    <path d="M148 40 C 152 54 158 66 168 80" stroke="#14532d" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- fish accent -->
    <path d="M40 158 C 48 152 60 152 66 158 C 60 164 48 164 40 158 Z" fill="#f8fafc" opacity="0.9"/>
    <path d="M40 158 L32 152 L32 164 Z" fill="#f8fafc" opacity="0.9"/>

    <!-- monogram M -->
    <path d="M58 132 V70 h14 l18 26 18-26 h14 v62 h-14 V93 l-18 25-18-25 v39 Z" fill="url(#mbLetter)"/>

    <!-- monogram B -->
    <path d="M118 70 h24 c11 0 18 6 18 15 c0 6-3 10-8 12 c6 2 10 7 10 14 c0 10-8 17-20 17 h-24 Z
             M132 82 v13 h10 c5 0 8-2 8-6.5 c0-4.5-3-6.5-8-6.5 Z
             M132 107 v13 h11 c5.5 0 9-2.5 9-6.5 c0-4-3.5-6.5-9-6.5 Z"
          fill="#FBF3E3" stroke="url(#mbRing)" stroke-width="3" fill-rule="evenodd"/>

    <!-- hard hat accent above B -->
    <path d="M132 64 a10 10 0 0 1 20 0 z" fill="#f59e0b"/>
    <rect x="130" y="63" width="24" height="3" rx="1.5" fill="#d97706"/>
  </g>

  <circle cx="100" cy="100" r="92" fill="none" stroke="#14532d" stroke-width="1" opacity="0.15"/>
</svg>
